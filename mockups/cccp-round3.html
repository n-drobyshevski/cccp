const SEC_FN = {source:secSource, fields:secFields, rules:secRules, access:secAccess, display:secDisplay};
const secBlock = k => { const s = SECS.find(x=>x[0]===k); return `<section class="panel sts" id="st-${k}"><header><h2>${s[1]}</h2><p>${s[2]}.</p></header>${SEC_FN[k]()}</section>`; };
const mark = k => k==='fields' && unmapped() ? '<span class="warnmark" title="Fields not mapped"></span>' : '';
function settingsPage(){
  const head = `<div class="top"><button class="backbtn" data-stback aria-label="Back to applications">${ICO.back}Back</button></div>
    <div class="sth"><h1>Settings</h1><p>Changes apply to everyone who opens CCCP after you save.</p></div>`;
  let body;
  if(O.set==='side') body = `<div class="st-a"><nav class="panel snavl" aria-label="Settings sections">${SECS.map(([k,l,h])=>`<button data-stsec="${k}" aria-current="${S.stsec===k}"><b>${l}${mark(k)}</b><small>${h}</small></button>`).join('')}</nav>${secBlock(S.stsec)}</div>`;
  else if(O.set==='tabs') body = `<div class="panel"><div class="stabs" role="tablist">${SECS.map(([k,l])=>`<button role="tab" data-stsec="${k}" aria-selected="${S.stsec===k}">${l}${mark(k)}</button>`).join('')}</div>${secBlock(S.stsec).replace('class="panel sts"','class="sts"')}</div>`;
  else body = `<nav class="anch" aria-label="Jump to">${SECS.map(([k,l])=>`<button class="pill" data-stjump="${k}"><span>${l}</span>${mark(k)}</button>`).join('')}</nav>${SECS.map(([k])=>secBlock(k)).join('')}`;
  return `<div class="stw">${head}${body}<div id="savebar">${savebar()}</div></div>`;
}
const savebar = () => dirty() ? `<div class="savebar" role="status"><span>You have unsaved changes</span><div><button class="btn" data-discard>Discard</button><button class="btn pri" data-save>Save changes</button></div></div>` : '';
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' + msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }

/* render + routing */
const lxRender = render;
render = function(focus){
  $('gear').setAttribute('aria-pressed', !!S.settings);
  if(!S.settings){ lxRender(focus); return; }
  $('nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
  $('root').innerHTML = settingsPage();
  const f = focus && document.querySelector(focus); if(f) f.focus();
};
function openSettings(push){ S.settings = true; S.app = null; S.pop = null; if(push){ S.pushed = true; try { history.pushState(null,'','#settings'); } catch(e){} } render(); scrollTo(0,0); }
const stRoute = () => { if(location.hash==='#settings') openSettings(false); else if(S.settings){ S.settings = false; render(); } };
addEventListener('popstate', stRoute);
$('gear').addEventListener('click', ()=> S.settings ? null : openSettings(true));
document.querySelector('.appbar').addEventListener('click', e=>{ if(e.target.closest('[data-go]')) S.settings = false; }, true);
$('gq').addEventListener('keydown', e=>{ if(e.key==='Enter') S.settings = false; }, true);
$('gres').addEventListener('click', ()=>{ S.settings = false; }, true);

/* settings events */
function setPath(p, val){ const ks = p.split('.'); let o = ST; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks[ks.length-1]] = val; }
function refreshLive(){ document.querySelectorAll('[data-cnt]').forEach(el=>el.innerHTML = `<b>${num(CNT[el.dataset.cnt]())}</b> apps`); $('savebar').innerHTML = savebar(); }
root.addEventListener('input', e=>{ if(!S.settings) return; const t = e.target, p = t.dataset.st; if(!p || t.type==='checkbox' || t.type==='radio' || t.tagName==='SELECT') return;
  setPath(p, t.type==='number' ? Math.max(1, +t.value || 1) : t.value); refreshLive(); });
root.addEventListener('change', e=>{ if(!S.settings) return; const t = e.target, p = t.dataset.st; if(!p) return;
  if(t.type==='checkbox') setPath(p, t.checked); else if(t.type==='radio') setPath(p, t.value); else if(t.tagName==='SELECT') setPath(p, t.value); else return;
  render(t.id ? '#'+t.id : `[data-st="${CSS.escape(p)}"]${t.type==='radio'?`[value="${t.value}"]`:''}`); });
root.addEventListener('click', e=>{ if(!S.settings) return;
  const t = e.target.closest('[data-stsec],[data-stjump],[data-stback],[data-seg],[data-tier],[data-rmadmin],[data-addadmin],[data-save],[data-discard],[data-reload]'); if(!t) return; const d = t.dataset;
  if(d.stsec){ S.stsec = d.stsec; render(); return; }
  if(d.stjump){ $('st-'+d.stjump).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'start'}); return; }
  if(d.stback!==undefined){ S.settings = false; if(S.pushed){ S.pushed = false; history.back(); return; } go(S.view==='heat'?'#heatmap':'#list'); render(); return; }
  if(d.seg){ setPath(d.seg, d.v); }
  else if(d.tier){ const a = ST.rules.drpTiers; a.includes(d.tier) ? a.splice(a.indexOf(d.tier),1) : a.push(d.tier); a.sort(); }
  else if(d.rmadmin){ ST.access.admins = ST.access.admins.filter(x=>x!==d.rmadmin); }
  else if(d.addadmin!==undefined){ const v = $('newadmin').value.trim(); if(!v) { $('newadmin').focus(); return; } if(!ST.access.admins.includes(v)) ST.access.admins.push(v); }
  else if(d.save!==undefined){ SAVED = JSON.parse(JSON.stringify(ST)); toast('Settings saved'); }
  else if(d.discard!==undefined){ ST = JSON.parse(JSON.stringify(SAVED)); }
  else if(d.reload!==undefined){ S.loading = true; render(); setTimeout(()=>{ S.loading = false; S.loaded = 'just now'; if(S.settings) render(); toast('Data reloaded · '+num(D.length)+' applications'); }, 1100); return; }
  render(d.addadmin!==undefined ? '#newadmin' : null);
});
root.addEventListener('keydown', e=>{ if(S.settings && e.target.id==='newadmin' && e.key==='Enter'){ e.preventDefault(); root.querySelector('[data-addadmin]').click(); } });

/* option strip */
document.querySelector('.opts').addEventListener('click', e=>{ const b = e.target.closest('.seg button'); if(!b || b.parentElement.dataset.o!=='set') return;
  O.set = b.dataset.v; applyOpts(); if(!S.settings) openSettings(true); else render(); }, true);
applyOpts();
try { history.replaceState(null,'','#settings'); } catch(e){}
S.app = null; openSettings(false);
</script>

<script>
/* settings layout is decided: C (tabs) */
O.set = 'tabs';
Object.assign(O, {hd:'lx', tg:'lx', tb:'lx', sx:'lx', sb:'lx'});
S.ftab = 'fact'; S.sbc = false;
const LXN = {
 hd:['Current header.','<b>Header:</b> an “A · Application” type badge, a large completeness %, a solid review seal, a “Lifecycle:” line and actions to copy the link or open the row in the Sheet.'],
 tg:['Neutral tags.','<b>Tags:</b> each tag group has its own colour; risk tags (internet exposed, personal data) are solid.'],
 tb:['No page tabs.','<b>Page tabs:</b> “Fact sheet” and “People”, with people shown as a roles list.'],
 sx:['Current sections.','<b>Sections:</b> larger section titles over a rule, and each pillar split into named subsections (Exposure, Testing, Classification…).'],
 sb:['Current sidebar.','<b>Sidebar:</b> a “Mandatory fields” checklist that collapses to a thin strip with »/«.']
};
applyOpts = function(){ document.documentElement.dataset.shell = O.shell;
  document.querySelectorAll('.opts .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', O[g.dataset.o]===b.dataset.v)));
  $('onote').innerHTML = Object.keys(LXN).map(k=>LXN[k][O[k]==='lx'?1:0]).join(' ') + ' Settings use layout C.'; };

const ILINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
const ISHEET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>';
const IMAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>';

function tagsHtml(a){
  const c = O.tg==='lx';
  return `<div class="tags ${c?'lxc':''}">${tier(a)}${c?'':lc(a)}${a.ty?`<span class="tag t-ty">${esc(a.ty)}</span>`:''}${a.h?`<span class="tag t-h">${esc(a.h)}</span>`:''}${a.ex==='Yes'?'<span class="tag t-ex">Internet exposed</span>':''}${a.pd==='Yes'?'<span class="tag t-pd">Personal data</span>':''}${a.sso==='No'?'<span class="tag t-sso">No SSO</span>':''}</div>`;
}
const baseLxHead = lxHead;
lxHead = function(a, jump){
  if(O.hd!=='lx'){ const h = baseLxHead(a, jump); return O.tg==='lx' ? h.replace(/<div class="tags">[\s\S]*?<\/div>/, tagsHtml(a)) : h; }
  const back = S.view==='heat' ? 'Heatmap' : 'Applications', q = qual(a), rv = review(a);
  return `<div class="top"><button class="backbtn" data-back aria-label="Back to ${back.toLowerCase()}">${ICO.back}Back</button><nav class="crumbs" aria-label="Breadcrumb"><button data-back>${back}</button><span>/</span><button data-dom="${esc(a.d)}">${esc(a.d)}</button><span>/</span><span>${esc(a.n)}</span></nav></div>
  <div class="hx">
    <div class="r1"><h1>${esc(a.n)}</h1>${O.dq==='on'?`<span class="big ${qcls(q.all)}" data-tip="${q.f} of ${q.t} security fields filled">${q.all}%</span>`:''}
      <div class="acts">${O.dq==='on'?`<span class="seal ${rv[0]}" data-tip="${a.val?'Last security check '+a.val:'No security check on record'}">${rv[1]}</span>`:''}
        <button class="icon-btn" data-copylink aria-label="Copy link" data-tip="Copy link">${ILINK}</button>
        <button class="icon-btn" data-opensheet aria-label="Open in Google Sheet" data-tip="Open row in the Sheet">${ISHEET}</button></div></div>
    <div class="r1"><span class="tbadge"><b>A</b><span>Application</span></span><span class="lcline">${ICHK}Lifecycle: <b>${lcl(a.lc)}</b></span>${tagsHtml(a)}</div>
    <div class="r3"><p class="desc">${esc(a.d)}${a.sd?' › '+esc(a.sd):''} · ${esc(a.g)}</p>
      <div class="pstat">${a.st.map((s,i)=>`<button class="stag ${s}" ${jump(i+1)} data-tip="${esc(a.why[i])}">${dot(s)}${P[i]}</button>`).join('')}</div></div>
  </div>`;
};

/* subsection bodies */
const subsec = (t, html) => html ? `<div class="subsec"><h4>${t}</h4>${html}</div>` : '';
function body2(a,i){
  if(i===0) return subsec('Exposure', kv([['Front exposed on internet',yn(a.ex, a.ex==='Yes' && !a.pt[0])],['External users',a.eu]])) +
    subsec('Testing', kv([['Last pentest',date(a.pt[0])],['Open findings',res(a.pt[1])]])) +
    subsec('Ownership', kv([['Security officer',a.so?person(a.so):'<span class="res bad">None assigned</span>']]));
  if(i===1) return subsec('Classification', `<div class="ciatw">${ciat(a)}</div>`) +
    subsec('Data', kv([['Personal data',yn(a.pd)],['Personal sensitive data',yn(a.psd)],['Company sensitive data',yn(a.csd)]])) +
    subsec('Review', kv([['Date of security check',date(a.val)],['Validated by security officer',a.ciat?(a.val?'<span class="res ok">Reviewed and validated</span>':'<span class="res warn">Not validated</span>'):'']])) +
    subsec('Audit', kv([['Last audit',date(a.au[0])],['Audit result',res(a.au[1])]]));
  if(i===2) return subsec('Recovery objectives', rto(a) + kv([['Max tolerable downtime',a.mtd!=null?a.mtd+' h':''],['Recovery time objective',a.rto!=null?a.rto+' h':''],['Recovery point objective',a.rpo!=null?a.rpo+' h':'']])) +
    subsec('DRP testing', kv([['Last DRP test',date(a.dt[0])],['Test result',res(a.dt[1])]]));
  return subsec('Hosting', kv([['Hosting type',a.h],['Typology',a.ty],['Single sign-on',a.sso==='No'?'<span class="res warn">No</span>':a.sso]])) +
    subsec('Usage', kv([['Internal users',a.iu],['External users',a.eu]])) +
    subsec('Lifecycle', stepper(a));
}
const ppl2 = a => { const rows = [['Owner',a.o,'Accountable for the application and its risks'],['Backup owner',a.bo,'Stands in for the owner'],['Security officer',a.so,'Validates the classification and follows up findings']];
  return `<div class="subs"><div class="hd"><span>${rows.filter(r=>r[1]).length} people</span></div>` + rows.map(([r,n,d])=>
    `<div class="r"><span>${n?person(n):'<span class="res bad">None assigned</span>'}</span>${n?`<button class="btn sm" data-contact="${esc(n)}">${IMAIL}Contact</button>`:'<span></span>'}<b>${r}</b><span class="mut">${d}</span></div>`).join('') + '</div>'; };

pageSections = function(a){
  const q = qual(a), lxs = O.sx==='lx';
  const sx = (k,i,inner) => { const st = i>=1&&i<=4 ? a.st[i-1] : null, p = i===0?null:q.g[i-1];
    return `<details class="fsx" id="sx-${k}" data-sx="${k}" ${S.closed.has(k)?'':'open'}><summary>${CHEV}${st?dot(st,STL[st]):''}<h2>${TITLES[i]}</h2>${O.dq==='on'&&p!=null?`<span class="pct">${p}%</span>`:''}${st?`<span class="why ${st}">${esc(a.why[i-1])}</span>`:''}</summary><div class="inner">${inner}</div></details>`; };
  const tabs = O.tb==='lx' ? `<div class="ftabs" role="tablist"><button role="tab" data-ftab="fact" aria-selected="${S.ftab==='fact'}">Fact sheet</button><button role="tab" data-ftab="people" aria-selected="${S.ftab==='people'}">People<small>${[a.o,a.bo,a.so].filter(Boolean).length}</small></button></div>` : '';
  if(O.tb==='lx' && S.ftab==='people') return `<article class="panel fs">${lxHead(a, i=>`data-jump="${KEYS[i]}"`)}${tabs}${ppl2(a)}</article>`;
  const pillar = i => lxs ? body2(a,i) : body(a,i);
  const overview = lxs ? subsec('Identity', overviewKv(a)) + (O.hd==='lx' ? '' : subsec('Lifecycle', stepper(a))) : overviewKv(a) + '<p class="sublbl">Lifecycle</p>' + stepper(a);
  return `<article class="panel fs ${lxs?'lxs':''}">${lxHead(a, i=>`data-jump="${KEYS[i]}"`)}${tabs}
    <div class="sbar"><select class="jump" aria-label="Jump to section">${TITLES.slice(0, O.tb==='lx'?5:6).map((t,i)=>`<option value="${KEYS[i]}">${t}</option>`).join('')}</select>
      <label class="search">${ICO.search}<input class="fsearch" type="search" placeholder="Search for sections and fields" value="${esc(S.fq)}" aria-label="Find a field"></label></div>
    <div>${sx('overview',0, overview)}${[0,1,2,3].map(i=>sx(KEYS[i+1],i+1, pillar(i))).join('')}${O.tb==='lx' ? '' : sx('people',5, lxs ? ppl2(a) : people(a))}</div></article>`;
};
const baseDq = dqSide;
dqSide = function(a){
  if(O.sb!=='lx') return baseDq(a);
  const q = qual(a);
  if(S.sbc) return `<aside class="panel dqmini" aria-label="Data quality"><button class="colb" data-sbc aria-label="Show data quality">«</button><span class="ring" style="--p:${q.all};--rc:${qcol(q.all)}" data-tip="${q.all}% complete"><b>${q.all}%</b></span></aside>`;
  const groups = QF.map(([n,fs])=>`<div class="qg"><b>${n}</b>${fs.map(([l,f])=>`<span class="qi ${f(a)?'y':''}"><i></i>${l}</span>`).join('')}</div>`).join('');
  const rec = S.recent.filter(i=>i!==a.i).slice(0,5);
  return `<aside class="panel dq lxsb" aria-label="Data quality">
    <div class="dqh"><h3>Data quality</h3><button class="colb" data-sbc aria-label="Hide data quality">»</button></div>
    <div class="ringw"><span class="ring" style="--p:${q.all};--rc:${qcol(q.all)}"><b>${q.all}%</b></span><p><b>Completeness</b><br><small>${q.f} of ${q.t} mandatory fields filled</small></p></div>
    <div><h3>Mandatory fields</h3>${groups}</div>
    ${rec.length?`<div><h3>Recently viewed</h3><div class="rec">${rec.map(i=>`<button data-app="${i}"><span class="tbadge"><b>A</b></span><span>${esc(D[i].n)}</span>${dots(D[i])}</button>`).join('')}</div></div>`:''}
  </aside>`;
};
/* sidebar width when collapsed */
const pageLx = page;
page = function(a){ const h = pageLx(a); return S.sbc && O.sb==='lx' && O.dq==='on' ? h.replace('<div class="lxwrap">','<div class="lxwrap sbc">') : h; };

root.addEventListener('click', e=>{
  const t = e.target.closest('[data-ftab],[data-sbc],[data-copylink],[data-opensheet],[data-contact]'); if(!t) return; const d = t.dataset;
  if(d.ftab){ S.ftab = d.ftab; render(); return; }
  if(d.sbc!==undefined){ S.sbc = !S.sbc; render(); return; }
  if(d.copylink!==undefined){ const u = location.href;
    try { navigator.clipboard.writeText(u).then(()=>toast('Link copied'), ()=>toast('Copy blocked here. Copy the address from the browser bar.')); } catch(err){ toast('Copy blocked here. Copy the address from the browser bar.'); } return; }
  if(d.opensheet!==undefined){ toast('In the real app this opens the application’s row in the Google Sheet'); return; }
  if(d.contact){ toast('In the real app this starts an email to '+d.contact); return; }
});
root.addEventListener('click', e=>{ if(e.target.closest('[data-app]')) S.ftab = 'fact'; }, true);

document.querySelector('.opts').addEventListener('click', e=>{
  const p = e.target.closest('[data-preset]'), b = e.target.closest('.seg button');
  if(p){ ['hd','tg','tb','sx','sb'].forEach(k=>O[k]=p.dataset.preset); }
  else if(b){ O[b.parentElement.dataset.o] = b.dataset.v; } else return;
  e.stopImmediatePropagation(); applyOpts();
  if(S.app===null){ S.settings = false; S.app = D.findIndex(a=>a.t===1 && a.st.includes('bad') && a.ciat && a.rto!=null && a.ex==='Yes'); try { history.replaceState(null,'','#app-'+S.app); } catch(err){} }
  render();
}, true);
applyOpts();
S.settings = false; S.app = D.findIndex(a=>a.t===1 && a.st.includes('bad') && a.ciat && a.rto!=null && a.ex==='Yes');
try { history.replaceState(null,'','#app-'+S.app); } catch(e){}
render();
</script>

<script>
Object.assign(O, {ov:'kpi', ls:'named', sv:'dd'});
const R3N = {
 ov:{kpi:'<b>Overview · KPI tiles.</b> Four headline numbers, a bar per pillar and a domain table. Every number opens the filtered list.',
     cards:'<b>Overview · Pillar cards.</b> One card per pillar with its gap count and its most common reasons, each reason opens the matching list.'},
 ls:{named:'<b>Landscape · named tiles.</b> Domains → subdomains → one named tile per application, coloured by the metric you pick.',
     cmp:'<b>Landscape · compact.</b> The same grouping as small squares; hover for the name. Fits all 1,125 applications on about one screen.'},
 sv:{dd:'<b>Saved views · dropdown.</b> A “View” menu at the start of the filter bar.',
     tabs:'<b>Saved views · tab row.</b> Views as tabs above the filters, with copy-link and delete on the active one.'}
};
applyOpts = function(){ document.documentElement.dataset.shell = O.shell;
  document.querySelectorAll('.opts .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', O[g.dataset.o]===b.dataset.v)));
  $('onote').innerHTML = ['ov','ls','sv'].map(k=>R3N[k][O[k]]).join(' ') + ' Everything from earlier rounds is kept (all LeanIX-like options, settings in tabs).'; };

/* ---------- nav: Overview + Landscape ---------- */
const IOV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';
const ILS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M10 10v11"/></svg>';
$('nav').insertAdjacentHTML('afterbegin', `<button data-go="over">${IOV}Overview</button>`);
$('nav').insertAdjacentHTML('beforeend', `<button data-go="land">${ILS}Landscape</button>`);
const HASH = {over:'#overview', list:'#list', heat:'#heatmap', land:'#landscape'};
document.querySelector('.appbar').addEventListener('click', e=>{
  const b = e.target.closest('[data-go]'); if(!b) return;
  e.stopImmediatePropagation(); S.settings = false; S.view = b.dataset.go; S.app = null; S.pop = null;
  try { history.replaceState(null,'',HASH[S.view]); } catch(err){} render(); scrollTo(0,0);
}, true);
addEventListener('popstate', ()=>{ const h = location.hash; if(h==='#overview'||h==='#landscape'){ S.app = null; S.settings = false; S.view = h==='#overview'?'over':'land'; render(); } });

/* ---------- helpers ---------- */
const RK = {bad:0, warn:1, none:2, ok:3};
const worst = a => a.st.reduce((w,s)=>RK[s]<RK[w]?s:w,'ok');
const IDOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>';
const ICOLS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>';
const IBOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const ITRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const IPLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ISHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 14c3 0 6 1.5 6 4.5"/></svg>';
const SORTI = '<svg viewBox="0 0 10 10" fill="currentColor"><path d="M5 1 8 4.5H2zM5 9 2 5.5h6z"/></svg>';
const SORTU = '<svg viewBox="0 0 10 10" fill="currentColor"><path d="M5 1.5 9 7H1z"/></svg>';
const SORTD = '<svg viewBox="0 0 10 10" fill="currentColor"><path d="M5 8.5 1 3h8z"/></svg>';
function goList(sel, view){ F.forEach(f=>S.sel[f.k] = new Set((sel||{})[f.k]||[])); S.q = ''; S.cur = null; S.view = view||'list'; S.app = null; S.settings = false; S.lim = 50; S.pop = null;
  try { history.pushState(null,'',HASH[S.view]); } catch(e){} render(); scrollTo(0,0); }

/* ---------- saved views ---------- */
S.views = [
 {id:'all', name:'All applications', sel:{}, sys:true},
 {id:'t1gaps', name:'Tier 1 with gaps', sel:{tier:['T1'], gap:P}, shared:true},
 {id:'noso', name:'No security officer', sel:{so:['None assigned']}, shared:true},
 {id:'mine', name:'My applications', sel:{so:['Person 0009']}}
];
S.cur = 'all'; S.saving = false;
const selOf = () => Object.fromEntries(F.filter(f=>S.sel[f.k].size).map(f=>[f.k,[...S.sel[f.k]].sort()]));
const same = (a,b) => JSON.stringify(Object.fromEntries(F.map(f=>[f.k,[...(a[f.k]||[])].sort()]))) === JSON.stringify(Object.fromEntries(F.map(f=>[f.k,[...(b[f.k]||[])].sort()])));
const curView = () => S.views.find(v=>v.id===S.cur);
const modified = () => { const v = curView(); return !!v && (!same(v.sel, selOf()) || !!S.q); };
function applyView(id){ const v = S.views.find(x=>x.id===id); if(!v) return; S.cur = id; F.forEach(f=>S.sel[f.k] = new Set(v.sel[f.k]||[])); S.q=''; S.lim = 50; S.pop = null; }
const vCount = v => D.filter(a=>F.every(f=>!(v.sel[f.k]||[]).length || a.f[f.k].some(x=>v.sel[f.k].includes(x)))).length;
function viewsDD(){
  const v = curView(), m = modified();
  const menu = S.pop==='views' ? `<div class="menu2 left" role="menu"><span class="lbl mlbl">Views</span>${S.views.map(x=>`<button data-view="${x.id}" aria-current="${x.id===S.cur}">${x.shared?ISHARE:IBOOK}${esc(x.name)}<small>${num(vCount(x))}</small></button>`).join('')}<hr>
     ${S.saving ? `<div class="saveform"><input class="inp" id="vname" placeholder="View name" aria-label="View name"><button class="btn pri sm" data-vsave>Save</button></div>`
       : `<button data-vnew>${IPLUS}Save current filters as a view</button>`}
     ${v && !v.sys ? `<button data-vlink>${ILINK}Copy link to “${esc(v.name)}”</button><button data-vdel>${ITRASH}Delete “${esc(v.name)}”</button>` : ''}</div>` : '';
  return `<span class="pw"><button class="pill vpill" data-vopen aria-expanded="${S.pop==='views'}" aria-haspopup="true">${IBOOK.replace('<svg','<svg width="14" height="14"')}<span>${v?esc(v.name):'Unsaved view'}${m?' <span class="mod">· edited</span>':''}</span>${ICO.cv}</button>${menu}</span>`;
}
function viewsTabs(){
  const v = curView(), m = modified();
  return `<div class="vtabs" role="tablist">${S.views.map(x=>`<button role="tab" data-view="${x.id}" aria-selected="${x.id===S.cur}">${x.shared?ISHARE:''}${esc(x.name)}</button>`).join('')}
    ${S.saving ? `<span class="vform"><input class="inp" id="vname" placeholder="View name" aria-label="View name"><button class="btn pri sm" data-vsave>Save</button><button class="btn sm" data-vcancel>Cancel</button></span>` : `<button class="add" data-vnew>${IPLUS}Save view</button>`}
    <span class="vact">${m?`<span class="modnote">Filters changed<button data-vupdate>Update view</button></span>`:''}${v && !v.sys ? `<button data-vlink>${ILINK}Copy link</button><button data-vdel>${ITRASH}Delete</button>` : ''}</span></div>`;
}
const tb2 = toolbar;
toolbar = function(){ let h = tb2();
  if(O.sv==='dd') h = h.replace('<div class="row"><label class="search">', '<div class="row">' + viewsDD() + '<label class="search">');
  else h = h.replace('<section class="panel toolbar" aria-label="Filters">', '<section class="panel toolbar" aria-label="Filters">' + viewsTabs());
  return h; };

/* ---------- inventory table ---------- */
const COLDEF = [
 {k:'n', l:'Application', fixed:1, sv:a=>a.n.toLowerCase(), r:a=>`<button class="nm" data-app="${a.i}" title="${esc(a.n)}">${esc(a.n)}</button>`},
 {k:'d', l:'Domain', sv:a=>a.d, r:a=>esc(a.d)},
 {k:'sd', l:'Subdomain', sv:a=>a.sd, r:a=>v(esc(a.sd))},
 {k:'g', l:'Support group', sv:a=>a.g, r:a=>`<span class="mut">${esc(a.g)}</span>`},
 {k:'t', l:'Tier', sv:a=>a.t||9, r:a=>tier(a)},
 {k:'lc', l:'Lifecycle', sv:a=>lcIdx(a.lc), r:a=>lc(a)},
 {k:'o', l:'Owner', sv:a=>a.o||'~', r:a=>v(esc(a.o))},
 {k:'so', l:'Security officer', sv:a=>a.so||'~', r:a=>a.so?esc(a.so):'<span class="mut">None assigned</span>'},
 {k:'ty', l:'Typology', sv:a=>a.ty||'~', r:a=>v(esc(a.ty))},
 {k:'h', l:'Hosting', sv:a=>a.h, r:a=>v(esc(a.h))},
 {k:'q', l:'Completeness', sv:a=>qual(a).all, r:a=>{ const q = qual(a); return `<span class="qcell"><span class="qbar"><i style="width:${q.all}%;--c:${qcol(q.all)}"></i></span><small>${q.all}%</small></span>`; }},
 {k:'st', l:'Status', sv:a=>-(a.st.filter(s=>s==='bad').length*100 + a.st.filter(s=>s==='warn').length*10), r:a=>dots(a), head:()=>`<span class="dhead">${PL.map((l,i)=>`<span data-tip="${P[i]}">${l}</span>`).join('')}</span>`}
];
S.cols = new Set(['n','d','t','lc','o','so','q','st']); S.sort = {k:'n', dir:1};
list = function(R){
  if(!R.length) return emptyState();
  const cols = COLDEF.filter(c=>S.cols.has(c.k)), s = COLDEF.find(c=>c.k===S.sort.k);
  const Rs = [...R].sort((x,y)=>{ const a = s.sv(x), b = s.sv(y); return (a<b?-1:a>b?1:0)*S.sort.dir || x.n.localeCompare(y.n); });
  return `<div class="tw"><table><thead><tr>${cols.map(c=>{ const on = S.sort.k===c.k;
      return `<th ${on?`aria-sort="${S.sort.dir>0?'ascending':'descending'}"`:''}><button class="sh" data-sort="${c.k}" ${on?'aria-sort="1"':''}>${c.head?c.head():c.l}${on?(S.sort.dir>0?SORTU:SORTD):SORTI}</button></th>`; }).join('')}</tr></thead><tbody>` +
    Rs.slice(0,S.lim).map(a=>`<tr data-app="${a.i}">${cols.map(c=>`<td>${c.r(a)}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>' +
    (R.length>S.lim ? `<div class="more"><button class="btn" data-more>Show 50 more · ${num(R.length-S.lim)} left</button></div>` : '');
};
function listTools(n){
  const cm = S.pop==='cols' ? `<div class="menu2" role="menu"><span class="lbl mlbl">Columns</span>${COLDEF.map(c=>`<label class="ckc ${c.fixed?'dis':''}"><input type="checkbox" data-col="${c.k}" ${S.cols.has(c.k)?'checked':''} ${c.fixed?'disabled':''}>${c.l}</label>`).join('')}</div>` : '';
  const em = S.pop==='export' ? `<div class="menu2" role="menu"><span class="lbl mlbl">Export ${num(n)} applications</span><button data-export="csv">${IDOWN}CSV file<small>.csv</small></button><button data-export="xlsx">${IDOWN}Excel workbook<small>.xlsx</small></button><button data-export="sheet">${ISHEET}New Google Sheet</button></div>` : '';
  return `<div class="rtools"><span class="pw"><button class="tbtn" data-pop2="cols" aria-expanded="${S.pop==='cols'}">${ICOLS}Columns</button>${cm}</span><span class="pw"><button class="tbtn" data-pop2="export" aria-expanded="${S.pop==='export'}">${IDOWN}Export</button>${em}</span></div>`;
}

/* ---------- landscape ---------- */
S.metric = 'worst';
const METRICS = [['worst','Worst status'],['c0','Cyber'],['c1','Compliance'],['c2','Continuity'],['c3','Platform'],['tier','Tier'],['q','Completeness']];
const SC = {ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)'};
function mval(a){ const m = S.metric;
  if(m==='worst' || m[0]==='c'){ const s = m==='worst' ? worst(a) : a.st[+m[1]]; return s==='none' ? null : SC[s]; }
  if(m==='tier') return a.t ? `color-mix(in srgb,var(--accent) ${[0,100,70,45,25][a.t]}%,var(--surface))` : null;
  return qcol(qual(a).all); }
function mlegend(){ const m = S.metric, it = (c,l) => `<span><i style="--c:${c}"></i>${l}</span>`, nd = l => `<span><i class="dash"></i>${l}</span>`;
  if(m==='tier') return [1,2,3,4].map(t=>it(`color-mix(in srgb,var(--accent) ${[0,100,70,45,25][t]}%,var(--surface))`,'T'+t)).join('') + nd('No tier');
  if(m==='q') return it('var(--ok)','80% or more') + it('var(--warn)','50–79%') + it('var(--bad)','Under 50%');
  return it(SC.ok,'OK') + it(SC.warn,'Needs attention') + it(SC.bad,'Gap') + nd('No data'); }
function landscape(R){
  if(!R.length) return emptyState();
  const by = new Map(); R.forEach(a=>{ if(!by.has(a.d)) by.set(a.d,new Map()); const m = by.get(a.d), k = a.sd||'Other'; if(!m.has(k)) m.set(k,[]); m.get(k).push(a); });
  const doms = [...by.entries()].sort((x,y)=>[...y[1].values()].flat().length-[...x[1].values()].flat().length);
  const tile = a => { const c = mval(a), tip = `${a.n} · ${METRICS.find(x=>x[0]===S.metric)[1]}: ${S.metric==='tier'?(a.t?'T'+a.t:'none'):S.metric==='q'?qual(a).all+'%':S.metric==='worst'?STL[worst(a)]:STL[a.st[+S.metric[1]]]}`;
    return O.ls==='cmp' ? `<button class="tc ${c?'':'dash'}" style="${c?`--c:${c}`:''}" data-app="${a.i}" data-tip="${esc(tip)}" aria-label="${esc(a.n)}"></button>`
      : `<button class="tl ${c?'':'dash'}" style="${c?`--c:${c}`:''}" data-app="${a.i}" title="${esc(tip)}">${esc(a.n)}</button>`; };
  return `<div class="land">${doms.map(([d,sm])=>{ const n = [...sm.values()].flat().length;
    return `<section class="dbox"><header><b>${esc(d)}</b><small>${n}</small></header>${[...sm.entries()].sort((x,y)=>y[1].length-x[1].length).map(([sd,as])=>
      `<div class="sdg"><span>${esc(sd)}</span><div class="tiles2 ${O.ls==='cmp'?'cmp':''}">${as.sort((x,y)=>x.n.localeCompare(y.n)).map(tile).join('')}</div></div>`).join('')}</section>`; }).join('')}</div>`;
}

/* ---------- results ---------- */
const res3 = results;
results = function(){
  const R = rows();
  if(S.view==='list') return `<div class="rhead"><span><b class="num">${num(R.length)}</b> <span class="mut">of ${num(D.length)} applications</span></span>${legend}${listTools(R.length)}</div>` + list(R);
  if(S.view==='land') return `<div class="rhead"><span><b class="num">${num(R.length)}</b> <span class="mut">of ${num(D.length)} applications</span></span><div class="metric"><span class="lbl">Colour by</span><span class="segs" role="group">${METRICS.map(([k,l])=>`<button data-metric="${k}" aria-pressed="${S.metric===k}">${l}</button>`).join('')}</span></div></div><div class="rhead" style="padding-top:0"><div class="lgd">${mlegend()}</div></div>` + landscape(R);
  return res3();
};

/* ---------- overview ---------- */
function overview(){
  const gap = D.filter(a=>a.st.includes('bad')), t1 = D.filter(a=>a.t===1), t1g = t1.filter(a=>a.st.includes('bad')), noso = D.filter(a=>!a.so), eol = D.filter(a=>['END_OF_LIFE','END_OF_SUPPORT'].includes(a.lc));
  const pct = (a,b) => Math.round(a/b*100);
  const kpis = `<div class="kpis">
    <button class="kpi bad" data-goto='{"gap":${JSON.stringify(P)}}'><span>Applications with a gap</span><b>${num(gap.length)}</b><small>${pct(gap.length,D.length)}% of ${num(D.length)}</small></button>
    <button class="kpi bad" data-goto='{"tier":["T1"],"gap":${JSON.stringify(P)}}'><span>Tier 1 with a gap</span><b>${num(t1g.length)}</b><small>of ${t1.length} Tier 1 applications</small></button>
    <button class="kpi warn" data-goto='{"so":["None assigned"]}'><span>No security officer</span><b>${num(noso.length)}</b><small>${pct(noso.length,D.length)}% of applications</small></button>
    <button class="kpi warn" data-goto='{"lc":["End of life","End of support"]}'><span>Past end of life</span><b>${num(eol.length)}</b><small>still listed as running</small></button></div>`;
  const stk = i => { const c = {bad:0,warn:0,none:0,ok:0}; D.forEach(a=>c[a.st[i]]++);
    return [c, `<span class="stk">${['bad','warn','none','ok'].map(s=>c[s]?`<i style="flex:${c[s]};--c:${s==='none'?'var(--line2)':SC[s]}" data-tip="${c[s]} ${STL[s].toLowerCase()}"></i>`:'').join('')}</span>`]; };
  const doms = [...new Set(D.map(a=>a.d))].map(d=>{ const as = D.filter(a=>a.d===d); return {d, n:as.length, g:as.filter(a=>a.st.includes('bad')).length, q:Math.round(as.reduce((s,a)=>s+qual(a).all,0)/as.length)}; })
    .sort((x,y)=>y.g-x.g).slice(0,8);
  const domT = `<section class="panel card2"><h2>Domains with the most gaps</h2><div class="tw"><table class="dt"><thead><tr><th>Domain</th><th>Apps</th><th>With a gap</th><th>Completeness</th></tr></thead><tbody>${doms.map(x=>
    `<tr data-goto='{"dom":[${JSON.stringify(x.d)}]}'><td><b>${esc(x.d)}</b></td><td class="num">${x.n}</td><td class="num" style="color:var(--bad)">${x.g}</td><td><span class="qcell"><span class="qbar"><i style="width:${x.q}%;--c:${qcol(x.q)}"></i></span><small>${x.q}%</small></span></td></tr>`).join('')}</tbody></table></div></section>`;
  const head = `<div class="ovh"><div><h1>Overview</h1><p>${num(D.length)} applications · data loaded ${S.loaded||'today'}</p></div></div>`;
  if(O.ov==='kpi'){
    const bars = `<section class="panel card2"><h2>Status by pillar</h2><div class="pbars">${P.map((p,i)=>{ const [c,h] = stk(i);
      return `<button class="pbar" data-goto='{"gap":["${p}"]}'><span>${dot('bad')}${p}</span>${h}<small><b>${c.bad}</b> gaps · ${c.warn} attention</small></button>`; }).join('')}</div>
      <div class="legend">${Object.entries(STL).map(([k,l])=>`<span>${dot(k)}${l}</span>`).join('')}</div></section>`;
    return `<div class="ov">${head}${kpis}<div class="two">${bars}${domT}</div></div>`;
  }
  const cards = `<div class="pcards">${P.map((p,i)=>{ const [c,h] = stk(i), rs = {}; D.forEach(a=>{ if(a.st[i]==='bad'||a.st[i]==='warn'){ const k = a.why[i]; rs[k] = rs[k]||{n:0,s:a.st[i]}; rs[k].n++; } });
    const top = Object.entries(rs).sort((x,y)=>RK[x[1].s]-RK[y[1].s]||y[1].n-x[1].n).slice(0,4);
    return `<section class="panel pcard"><h2>${dot(c.bad?'bad':'ok')}${p}</h2><div class="bign"><b>${c.bad}</b><span>gaps · ${c.warn} need attention</span></div>${h}
      <ul class="reasons">${top.map(([r,o])=>`<li><button data-goto='{"gap":["${p}"]}' data-q2="${esc(r)}">${dot(o.s)}<span>${esc(r)}</span><small>${o.n}</small></button></li>`).join('')}</ul></section>`; }).join('')}</div>`;
  const chips = `<div class="kchips"><button class="pill" data-goto='{"tier":["T1"],"gap":${JSON.stringify(P)}}'><span>Tier 1 with a gap</span><small>${t1g.length}</small></button><button class="pill" data-goto='{"so":["None assigned"]}'><span>No security officer</span><small>${noso.length}</small></button><button class="pill" data-goto='{"lc":["End of life","End of support"]}'><span>Past end of life</span><small>${eol.length}</small></button></div>`;
  return `<div class="ov">${head}${chips}${cards}${domT}</div>`;
}

/* ---------- render ---------- */
const r3 = render;
render = function(focus){
  if(!S.settings && S.app===null && S.view==='over'){
    $('gear').setAttribute('aria-pressed','false');
    $('nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.go==='over'));
    $('root').innerHTML = overview(); return; }
  r3(focus);
  if(S.app===null && !S.settings) $('nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.go===S.view));
  const m = document.querySelector('.menu2'); if(m){ const r = m.getBoundingClientRect(); if(r.left < 8){ m.classList.add('left'); } if(r.right > innerWidth-8) m.classList.remove('left'); }
};

/* ---------- events ---------- */
root.addEventListener('click', e=>{
  const t = e.target.closest('[data-goto],[data-sort],[data-pop2],[data-export],[data-metric],[data-vopen],[data-view],[data-vnew],[data-vsave],[data-vcancel],[data-vlink],[data-vdel],[data-vupdate]'); if(!t) return; const d = t.dataset;
  if(d.goto){ goList(JSON.parse(d.goto)); return; }
  if(d.sort){ S.sort = S.sort.k===d.sort ? {k:d.sort, dir:-S.sort.dir} : {k:d.sort, dir:1}; }
  else if(d.pop2){ S.pop = S.pop===d.pop2 ? null : d.pop2; }
  else if(d.export){ S.pop = null; const n = rows().length;
    toast(d.export==='sheet' ? `In the real app this creates a Google Sheet with ${num(n)} rows` : `In the real app this downloads cccp-export.${d.export} with ${num(n)} rows`); }
  else if(d.metric){ S.metric = d.metric; }
  else if(d.vopen!==undefined){ S.pop = S.pop==='views' ? null : 'views'; S.saving = false; }
  else if(d.view){ applyView(d.view); }
  else if(d.vnew!==undefined){ S.saving = true; if(O.sv==='dd') S.pop = 'views'; render('#vname'); return; }
  else if(d.vcancel!==undefined){ S.saving = false; }
  else if(d.vsave!==undefined){ const n = ($('vname').value||'').trim(); if(!n){ $('vname').focus(); return; }
    const id = 'v'+Date.now(); S.views.push({id, name:n, sel:selOf()}); S.cur = id; S.saving = false; S.pop = null; toast(`View “${n}” saved`); }
  else if(d.vupdate!==undefined){ const v = curView(); if(v && !v.sys){ v.sel = selOf(); toast(`View “${v.name}” updated`); } else { S.saving = true; render('#vname'); return; } }
  else if(d.vlink!==undefined){ const v = curView(); S.pop = null; toast(`Link to “${v.name}” copied. Anyone who opens it sees the same filters.`); }
  else if(d.vdel!==undefined){ const v = curView(); S.views = S.views.filter(x=>x!==v); applyView('all'); toast(`View “${v.name}” deleted`); }
  render();
});
root.addEventListener('keydown', e=>{ if(e.target.id==='vname'){ if(e.key==='Enter'){ e.preventDefault(); root.querySelector('[data-vsave]').click(); } if(e.key==='Escape'){ S.saving = false; render(); } } });
root.addEventListener('change', e=>{ const t = e.target; if(!t.matches('input[data-col]')) return; t.checked ? S.cols.add(t.dataset.col) : S.cols.delete(t.dataset.col);
  render(`input[data-col="${t.dataset.col}"]`); });
/* any filter change keeps the view selected but marks it edited; clearing everything returns to “All applications” */
root.addEventListener('click', e=>{ if(e.target.closest('[data-clear="*"]')) S.cur = 'all'; }, true);

/* option strip: drop the listeners from earlier rounds */
{ const oo = document.querySelector('.opts'); oo.replaceWith(oo.cloneNode(true)); }
document.querySelector('.opts').addEventListener('click', e=>{ const b = e.target.closest('.seg button'); if(!b) return;
  e.stopImmediatePropagation(); O[b.parentElement.dataset.o] = b.dataset.v; applyOpts();
  const k = b.parentElement.dataset.o, want = {ov:'over', ls:'land', sv:'list'}[k];
  S.settings = false; S.app = null; S.view = want; S.pop = null; try { history.replaceState(null,'',HASH[want]); } catch(err){} render(); }, true);
applyOpts();
S.settings = false; S.app = null; S.view = 'over'; try { history.replaceState(null,'','#overview'); } catch(e){}
render();
</script>
