<meta name="claude:viewport-fit-sides" content="cover">
<title>CCCP Round Three</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app bar, then toolbar (quick views, search, tier toggles, filter pills), then optional filter sidebar + content (list, heatmap or application page). Soft style, cobalt accent. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#f5f7fa; --line:#dde2ea; --line2:#c9d0db;
  --fg:#151a23; --muted:#5a6474;
  --accent:oklch(0.48 0.17 265); --on-accent:#ffffff; --accent-soft:oklch(0.95 0.03 265);
  --ok:#1b8556; --warn:#c07a00; --bad:#c9303e; --none:#98a1b0;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --rc:18px; --rs:14px;
  --shadow:0 10px 30px color-mix(in srgb,var(--fg) 16%,transparent);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a22; --surface2:#1c212b; --line:#2a313e; --line2:#3a4252;
  --fg:#e7eaf0; --muted:#97a1b2;
  --accent:oklch(0.76 0.12 265); --on-accent:#0e1117; --accent-soft:oklch(0.3 0.06 265);
  --ok:#4bc088; --warn:#e2a03a; --bad:#ee6370; --none:#5a6373; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface2:#1c212b; --line:#2a313e; --line2:#3a4252;
  --fg:#e7eaf0; --muted:#97a1b2;
  --accent:oklch(0.76 0.12 265); --on-accent:#0e1117; --accent-soft:oklch(0.3 0.06 265);
  --ok:#4bc088; --warn:#e2a03a; --bad:#ee6370; --none:#5a6373; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
.shell{max-width:1280px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- app bar ---------- */
.appbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;border:0;background:none;padding:0;text-align:left}
.logo{display:grid;grid-template-columns:repeat(2,13px);gap:3px}
.logo i{width:13px;height:13px;border-radius:50%;background:var(--accent)}
.logo i:nth-child(2){opacity:.75}.logo i:nth-child(3){opacity:.55}.logo i:nth-child(4){background:var(--fg)}
.brand b{display:block;font:600 17px/1.1 var(--sans);letter-spacing:.04em}
.brand small{display:block;color:var(--muted);font-size:12px}
.segc{display:inline-flex;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);gap:2px}
.segc button{border:0;background:none;padding:5px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.segc button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);color:var(--muted)}
.icon-btn:hover{color:var(--fg);border-color:var(--line2)}
.icon-btn svg{width:17px;height:17px}

/* ---------- toolbar ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);min-width:0}
.toolbar{display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.views{gap:6px}
.views .lbl{margin-right:4px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.search{position:relative;flex:1 1 240px;min-width:0}
.search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:7px 10px 7px 32px}
.search input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.pw{position:relative;display:inline-flex}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;white-space:nowrap;max-width:260px}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill:hover{border-color:var(--line2)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.pill .cv{width:9px;height:9px;flex:none;opacity:.7}
.pill small{color:var(--muted);font:500 11px var(--mono)}
.pill.on small{color:inherit}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:600 11px var(--mono)}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.tg button{border:0;background:none;padding:5px 11px;font:500 12px var(--mono);border-right:1px solid var(--line);color:var(--muted)}
.tg button:last-child{border-right:0}
.tg button:hover{color:var(--fg)}
.tg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:16px;color:var(--accent);font-weight:500;max-width:100%}
.chip span{padding:4px 2px 4px 12px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.chip button{border:0;background:none;color:inherit;padding:4px 10px 4px 6px;font-size:15px;line-height:1}
.linkbtn{border:0;background:none;color:var(--muted);padding:4px 2px;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--accent)}
.sbtn{margin-left:auto}
.sbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}

/* popover */
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:280px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
.pop.right{left:auto;right:0}
.find{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 8px;width:100%}
.find:focus{border-color:var(--accent);outline:none}
.plist{max-height:250px;overflow:auto;display:flex;flex-direction:column}
.ck{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;cursor:pointer}
.ck:hover{background:var(--surface2)}
.ck span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck small{color:var(--muted);font:500 11px var(--mono)}
.ck.zero span{color:var(--muted)}
.ck input{appearance:none;width:16px;height:16px;margin:0;flex:none;border:1.5px solid var(--line2);border-radius:5px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.ck .dot{margin:0 -2px 0 0}
.pfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:6px 4px 0;font-size:12px;color:var(--muted)}
.hint{padding:6px;color:var(--muted)}

/* ---------- body ---------- */
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.body.side-on{grid-template-columns:260px minmax(0,1fr)}
.side{padding:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.side header{display:flex;justify-content:space-between;align-items:center}
.side header b{font-weight:600}
.fac{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.fac legend{padding:0;margin-bottom:6px}
.fac .plist{max-height:190px}
@media (max-width:820px){ .body.side-on{grid-template-columns:minmax(0,1fr)} .side{position:static;max-height:none} }

/* status dots */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.dot.ok{--c:var(--ok)} .dot.warn{--c:var(--warn)} .dot.bad{--c:var(--bad)}
.dot.none{background:none;border:1.5px dashed var(--none)}
.dots{display:inline-grid;grid-template-columns:repeat(4,14px);justify-items:center;align-items:center;vertical-align:middle}
.dhead{display:inline-grid;grid-template-columns:repeat(4,14px);justify-items:center;font:600 10px var(--mono);letter-spacing:0}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:30;
  background:var(--fg);color:var(--surface);font:500 12px/1.3 var(--sans);letter-spacing:0;text-transform:none;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}

.tip-below[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px);left:auto;right:0;transform:none}
/* tier + lifecycle */
.tier{display:inline-block;font:600 11px var(--mono);padding:1px 7px;border:1px solid var(--line2);border-radius:10px;color:var(--muted);white-space:nowrap}
.tier.t1{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.tier.t2{color:var(--fg)}
.tier.t0{border-style:dashed;color:var(--none)}
.lc{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.lc::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--none)}
.lc.ga::before{background:var(--ok)} .lc.beta::before{background:var(--accent)} .lc.eol::before{background:var(--bad)} .lc.dec::before{background:var(--warn)}

/* ---------- list ---------- */
.rhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.rhead b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 14px;border-block:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.nm{display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis;font-weight:500;border:0;background:none;padding:0;text-align:left}
tr:hover .nm{color:var(--accent)}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 14px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg);font-weight:600}

/* ---------- heatmap ---------- */
.heat td{padding:8px 14px}
.heat td.hc{white-space:normal;min-width:160px;font-size:12px;padding:3px 4px}
.heat td.hc span{display:flex;gap:7px;align-items:center;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.hc.ok{--c:var(--ok)} .hc.warn{--c:var(--warn)} .hc.bad{--c:var(--bad)} .hc.none{--c:var(--none)}
.hc.none span{color:var(--muted)}
.grp td{background:var(--surface2);border-top:1px solid var(--line)}
.grp:first-child td{border-top:0}
.gb{border:0;background:none;padding:0;font-weight:600;display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.gb svg{width:12px;height:12px;transition:transform .15s}
.gb[aria-expanded="true"] svg{transform:rotate(90deg)}
.gb span{color:var(--muted);font:500 11px var(--mono)}
.grp td.sbc{padding:8px 6px}
.sbw{display:flex;align-items:center;gap:8px}
.sb{display:flex;flex:1;min-width:90px;height:8px;border-radius:4px;overflow:hidden;gap:1px;background:var(--line)}
.sb i{background:var(--c)} .sb .ok{--c:var(--ok)} .sb .warn{--c:var(--warn)} .sb .bad{--c:var(--bad)} .sb .none{--c:var(--line2)}
.sbw small{min-width:22px;text-align:right;color:var(--bad);font:600 11px var(--mono)}
@media (prefers-reduced-motion:reduce){ .gb svg{transition:none} }

/* ---------- application page ---------- */
.fs{padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:5px 12px 5px 9px;font-weight:500}
.backbtn:hover{border-color:var(--accent);color:var(--accent)}
.backbtn svg{width:15px;height:15px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:0;color:var(--muted)}
.crumbs button:hover{color:var(--accent);text-decoration:underline}
.crumbs span:last-child{color:var(--fg)}
.fh{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.fh h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.fh .sum{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.stag{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 8px;font-size:12px;font-weight:500}
.stag.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.stag.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.l4{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.rail{border:1px solid var(--line);border-radius:var(--rs);background:var(--surface2);padding:14px;display:flex;flex-direction:column;gap:12px}
.rail dl{margin:0;display:flex;flex-direction:column;gap:12px}
.rail dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.rail dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.person{display:flex;align-items:center;gap:8px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--mono);background:var(--accent-soft);color:var(--accent);flex:none}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1040px){ .secs{grid-template-columns:minmax(0,1fr)} }
.sec{border:1px solid var(--line);border-radius:var(--rs);min-width:0;background:var(--surface)}
.sec header{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sec h2{margin:0;font-size:14px;font-weight:600}
.sec header .why{margin-left:auto;font-size:12px;text-align:right;color:var(--muted)}
.sec header .why.bad{color:var(--bad)} .sec header .why.warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:minmax(120px,44%) 1fr;gap:9px 12px;padding:14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.yn{display:inline-flex;align-items:center;gap:6px}
.yn.yes.risk{color:var(--bad);font-weight:500}
.res{display:inline-block;padding:1px 8px;border-radius:8px;font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--line)}
.res.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.res.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.res.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.age{color:var(--muted);font-size:12px;margin-left:6px}
.ciatw{padding:14px 14px 0}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.bars div{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.bars b{font:600 17px var(--mono);color:var(--fg)}
.bars b small{font:500 11px var(--mono);color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.unset{display:flex;align-items:center;gap:8px;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);padding:10px 12px}
.rto{padding:14px 14px 0;display:flex;flex-direction:column;gap:6px}
.rto .track{position:relative;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.rto .track i{position:absolute;top:3px;bottom:3px;left:3px;border-radius:4px;background:var(--c,var(--accent));opacity:.85}
.rto .ax{display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--muted)}
.rto .cap{font-size:12px;color:var(--muted)}
@media (max-width:820px){ .l4{grid-template-columns:minmax(0,1fr)} .fh .sum{margin-left:0} }
.foot{color:var(--muted);font-size:12px;margin:0}

/* ---------- LeanIX-direction extensions ---------- */
:root{ --nav:#18265e; --nav-fg:#ffffff; --nav-mut:#b9c3e8; --nav-hi:rgba(255,255,255,.14); --nav-in:rgba(255,255,255,.1); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --nav:#131b37; --nav-fg:#eef1fa; --nav-mut:#9aa6cc; --nav-hi:rgba(255,255,255,.12); --nav-in:rgba(255,255,255,.07); } }
:root[data-theme="dark"]{ --nav:#131b37; --nav-fg:#eef1fa; --nav-mut:#9aa6cc; --nav-hi:rgba(255,255,255,.12); --nav-in:rgba(255,255,255,.07); }

/* mockup option strip (not part of the app) */
.opts{max-width:1280px;margin:0 auto;padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;border-bottom:1px dashed var(--line2)}
.opts h1{margin:0;font-size:15px;font-weight:600;flex:1 1 100%}
.opt{display:flex;flex-direction:column;gap:4px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.onote{margin:0;color:var(--muted);flex:1 1 100%;max-width:90ch}
.onote b{color:var(--fg);font-weight:600}

/* app bar, three shells */
.appbar{display:block}
.abin{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navb{display:inline-flex;gap:2px}
.navb button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.navb button svg{width:17px;height:17px}
.navb button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.gs{position:relative;flex:0 1 340px;min-width:0;order:3}
.gs svg{position:absolute;left:11px;top:50%;width:15px;height:15px;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.gs input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px 7px 33px}
.gs input:focus{outline:none;border-color:var(--accent)}
#theme{order:4}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.gres button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px}
.gres button:hover,.gres button.hl{background:var(--surface2)}
.gres span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres .dots,.rec .dots{flex:none}

/* ---------- atoms ---------- */
const dot = (s,tip) => `<i class="dot ${s}"${tip?` data-tip="${esc(tip)}"`:''}></i>`;

const tier = a => a.t ? `<span class="tier t${a.t}">T${a.t}</span>` : '<span class="tier t0" data-tip="No tiering set">–</span>';
const lc = a => `<span class="lc ${LCC[a.lc]||''}">${lcl(a.lc)}</span>`;
const initials = n => n ? n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase() : '?';
const person = n => n ? `<span class="person"><span class="av" aria-hidden="true">${esc(initials(n))}</span>${esc(n)}</span>` : dash;
const ago = d => { if(!d) return ''; const m = Math.round((TODAY - new Date(d)) / 2629800000);
  return `<span class="age">${m<1?'this month':m<12?m+' mo ago':Math.floor(m/12)+' yr'+(m>=24?'s':'')+' ago'}</span>`; };
const date = d => d ? `<span class="num">${d}</span>${ago(d)}` : '';
const yn = (x,risk) => !x ? '' : `<span class="yn ${x==='Yes'?'yes':''} ${risk?'risk':''}">${x}</span>`;
const res = x => !x ? '' : `<span class="res ${/Passed|None/.test(x)?'ok':/critical|major|Failed/.test(x)?'bad':/high/.test(x)?'warn':''}">${esc(x)}</span>`;

/* ---------- filtering ---------- */
const anyF = () => F.some(f=>S.sel[f.k].size);

const rows = skip => D.filter(a=>match(a,skip));
function counts(k){ const m = new Map(); rows(k).forEach(a=>a.f[k].forEach(x=>m.set(x,(m.get(x)||0)+1))); return m; }
function values(k, find){
  const c = counts(k), q = (find||'').toLowerCase(), list = VALS[k].filter(x=>!q || x.toLowerCase().includes(q));
  return list.length ? list.map(x=>`<label class="ck ${c.get(x)?'':'zero'}"><input type="checkbox" data-f="${k}" value="${esc(x)}" ${S.sel[k].has(x)?'checked':''}>${k==='gap'?dot('bad'):''}<span title="${esc(x)}">${esc(x)}</span><small>${c.get(x)||0}</small></label>`).join('')
    : '<span class="hint">Nothing matches</span>'; }
const label = k => { const s = [...S.sel[k]]; return !s.length ? FK[k].l : `${FK[k].l}: ${s[0]}${s.length>1?` +${s.length-1}`:''}`; };
const selN = () => F.reduce((n,f)=>n+S.sel[f.k].size,0);

/* ---------- toolbar ---------- */
function toolbar(){
  const cur = JSON.stringify(F.map(f=>[...S.sel[f.k]].sort()));
  const quick = '<div class="row views"><span class="lbl">Quick views</span>' + QUICK.map(([n,p],i)=>{
    const on = !S.q && cur===JSON.stringify(F.map(f=>[...(p[f.k]||[])].sort()));
    const c = D.filter(a=>F.every(f=>!p[f.k]||a.f[f.k].some(x=>p[f.k].includes(x)))).length;
    return `<button class="pill ${on?'on':''}" data-quick="${i}" aria-pressed="${on}"><span>${n}</span><small>${num(c)}</small></button>`; }).join('') + '</div>';
  const tierTg = `<div class="tg" role="group" aria-label="Tier">${VALS.tier.map(x=>`<button data-tv="${x}" aria-pressed="${S.sel.tier.has(x)}"${x==='No tier'?' data-tip="No tier"':''}>${x==='No tier'?'–':x}</button>`).join('')}</div>`;

  const n = selN();
  return `<section class="panel toolbar" aria-label="Filters">${quick}
    <div class="row"><label class="search">${ICO.search}<input id="q" type="search" placeholder="Search name, team, owner, officer" value="${esc(S.q)}" aria-label="Search applications"></label>

}
const pop = k => `<div class="pop" data-pop>${FK[k].big?`<input type="search" class="find" id="pq" data-pk="${k}" placeholder="Find ${FK[k].l.toLowerCase()}" value="${esc(S.pq)}" aria-label="Find ${FK[k].l}">`:''}<div class="plist" data-list="${k}">${values(k,S.pq)}</div><div class="pfoot"><span>${S.sel[k].size} selected</span><button class="linkbtn" data-clear="${k}">Clear</button></div></div>`;

  return `<aside class="panel side" aria-label="Filter panel"><header><b>Filters</b><button class="linkbtn" data-side>Hide</button></header>` +
    ['dom','lc','so','gap'].map(k=>{ const f = FK[k];
      return `<fieldset class="fac"><legend class="lbl">${f.l}${S.sel[k].size?` · ${S.sel[k].size}`:''}</legend>${f.big?`<input type="search" class="find" data-sq="${k}" placeholder="Find ${f.l.toLowerCase()}" value="${esc(S.sq[k])}" aria-label="Find ${f.l}">`:''}<div class="plist" data-list="${k}">${values(k,S.sq[k])}</div></fieldset>`; }).join('') + '</aside>'; }

/* ---------- list ---------- */
const legend = '<div class="legend">' + Object.entries(STL).map(([k,l])=>`<span>${dot(k)}${l}</span>`).join('') + '</div>';
const emptyState = () => `<div class="empty"><b>No application matches</b><span>Try removing a filter or changing the search.</span><button class="btn" data-clear="*">Clear all filters</button></div>`;
function list(R){
  if(!R.length) return emptyState();
  return `<div class="tw"><table><thead><tr><th>Application</th><th>Domain</th><th>Tier</th><th>Lifecycle</th><th>Owner</th><th>Security officer</th><th><span class="dhead">${PL.map((l,i)=>`<span data-tip="${P[i]}">${l}</span>`).join('')}</span></th></tr></thead><tbody>` +
    R.slice(0,S.lim).map(a=>`<tr data-app="${a.i}"><td><button class="nm" data-app="${a.i}" title="${esc(a.n)}">${esc(a.n)}</button></td><td>${esc(a.d)}</td><td>${tier(a)}</td><td>${lc(a)}</td><td>${v(esc(a.o))}</td><td>${a.so?esc(a.so):'<span class="mut">None assigned</span>'}</td><td>${dots(a)}</td></tr>`).join('') +
    '</tbody></table></div>' + (R.length>S.lim ? `<div class="more"><button class="btn" data-more>Show 50 more · ${num(R.length-S.lim)} left</button></div>` : '');
}
/* ---------- heatmap ---------- */
function heat(R){
  if(!R.length) return emptyState();
  const by = new Map(); R.forEach(a=>{ if(!by.has(a.d)) by.set(a.d,[]); by.get(a.d).push(a); });
  const doms = [...by.entries()].sort((x,y)=>y[1].length-x[1].length), all = by.size===1 || R.length<=40;
  if(S.open===null) S.open = new Set([doms[0][0]]);
  const bar = (g,k) => { const c = {bad:0,warn:0,none:0,ok:0}; g.forEach(a=>c[a.st[k]]++);
    return `<td class="sbc"><span class="sbw" data-tip="${c.bad} gap · ${c.warn} attention · ${c.none} no data · ${c.ok} OK"><span class="sb">${['bad','warn','none','ok'].map(s=>c[s]?`<i class="${s}" style="flex:${c[s]}"></i>`:'').join('')}</span><small>${c.bad||''}</small></span></td>`; };
  const row = a => `<tr data-app="${a.i}"><td><button class="nm" data-app="${a.i}" title="${esc(a.n)}">${esc(a.n)}</button></td><td>${tier(a)}</td>${a.st.map((s,k)=>`<td class="hc ${s}"><span>${dot(s)}${esc(a.why[k])}</span></td>`).join('')}</tr>`;
  return '<div class="tw"><table class="heat"><thead><tr><th>Domain / application</th><th>Tier</th>' + P.map(p=>`<th>${p}</th>`).join('') + '</tr></thead><tbody>' +
    doms.map(([d,g])=>{ const o = all || S.open.has(d);
      return `<tr class="grp"><td colspan="2"><button class="gb" data-grp="${esc(d)}" aria-expanded="${o}">${ICO.chev}${esc(d)} <span>${g.length}</span></button></td>${[0,1,2,3].map(k=>bar(g,k)).join('')}</tr>` + (o ? g.map(row).join('') : ''); }).join('') + '</tbody></table></div>';
}
/* ---------- application page ---------- */
const CN = ['Confidentiality','Integrity','Availability','Traceability'];
function ciat(a){
  if(!a.ciat) return '<div class="unset">' + dot('none') + 'Not classified yet</div>';
  return '<div class="bars">' + CN.map((n,k)=>`<div><span>${n}</span><b>${a.ciat[k]}<small> / 4</small></b><span class="pips">${[1,2,3,4].map(x=>`<i class="${x<=a.ciat[k]?'on':''}"></i>`).join('')}</span></div>`).join('') + '</div>'; }
function rto(a){
  if(a.rto==null) return '';
  const max = 72, w = h => Math.max(2, Math.min(100, h/max*100));
  return `<div class="rto"><span class="cap">Recovery time against max tolerable downtime</span>
    <div class="track" role="img" aria-label="RTO ${a.rto} hours, MTD ${a.mtd} hours"><i style="width:calc(${w(a.mtd)}% - 6px);--c:var(--line2)"></i><i style="width:calc(${w(a.rto)}% - 6px)"></i></div>
    <div class="ax"><span>0 h</span><span>24 h</span><span>48 h</span><span>72 h</span></div></div>`; }
function body(a,i){
  if(i===0) return kv([['Front exposed on internet',yn(a.ex, a.ex==='Yes' && !a.pt[0])],['Last pentest',date(a.pt[0])],['Open findings',res(a.pt[1])],['Security officer',a.so?person(a.so):'<span class="res bad">None assigned</span>']]);
  if(i===1) return `<div class="ciatw">${ciat(a)}</div>` + kv([['Personal data',yn(a.pd)],['Personal sensitive data',yn(a.psd)],['Company sensitive data',yn(a.csd)],['Date of security check',date(a.val)],['Validated by security officer',a.ciat?(a.val?res('Reviewed and validated').replace('class="res ','class="res ok '):'<span class="res warn">Not validated</span>'):''],['Last audit',date(a.au[0])],['Audit result',res(a.au[1])]]);
  if(i===2) return rto(a) + kv([['Max tolerable downtime',a.mtd!=null?a.mtd+' h':''],['Recovery time objective',a.rto!=null?a.rto+' h':''],['Recovery point objective',a.rpo!=null?a.rpo+' h':''],['Last DRP test',date(a.dt[0])],['Test result',res(a.dt[1])]]);
  return kv([['Hosting type',a.h],['Typology',a.ty],['Lifecycle',lc(a)],['Single sign-on',a.sso==='No'?'<span class="res warn">No</span>':a.sso],['Internal users',a.iu],['External users',a.eu]]);
}
function page(a){
  const sec = i => `<section class="sec" aria-labelledby="h-${i}"><header>${dot(a.st[i],STL[a.st[i]])}<h2 id="h-${i}">${P[i]}</h2><span class="why ${a.st[i]}">${esc(a.why[i])}</span></header>${body(a,i)}</section>`;
  const back = S.view==='heat' ? 'Heatmap' : 'Applications';
  return `<article class="panel fs">
    <div class="top"><button class="backbtn" data-back aria-label="Back to ${back.toLowerCase()}">${ICO.back}Back</button><nav class="crumbs" aria-label="Breadcrumb"><button data-back>${back}</button><span>/</span><button data-dom="${esc(a.d)}">${esc(a.d)}</button><span>/</span><span>${esc(a.n)}</span></nav></div>
    <div class="fh"><h1>${esc(a.n)}</h1>${tier(a)}${lc(a)}<div class="sum">${a.st.map((s,i)=>`<span class="stag ${s}" data-tip="${esc(a.why[i])}">${dot(s)}${P[i]}</span>`).join('')}</div></div>
    <div class="l4"><aside class="rail"><dl>
      <div><dt>Domain</dt><dd>${v(esc(a.d))}</dd></div><div><dt>Subdomain</dt><dd>${v(esc(a.sd))}</dd></div><div><dt>Support group</dt><dd>${v(esc(a.g))}</dd></div>
      <div><dt>Owner</dt><dd>${person(a.o)}</dd></div><div><dt>Backup owner</dt><dd>${person(a.bo)}</dd></div><div><dt>Security officer</dt><dd>${a.so?person(a.so):'<span class="res bad">None assigned</span>'}</dd></div>
    </dl></aside><div class="secs">${[0,1,2,3].map(sec).join('')}</div></div></article>`;
}

/* ---------- render ---------- */
function results(){ const R = rows();
  const h = `<div class="rhead"><span><b class="num">${num(R.length)}</b> <span class="mut">of ${num(D.length)} applications</span></span>${S.view==='list'?legend:'<div class="legend"><span>Bars show the share of applications per status; the red number counts gaps.</span></div>'}</div>`;
  return h + (S.view==='list' ? list(R) : heat(R)); }
function render(focus){
  const sc = {}; document.querySelectorAll('[data-list]').forEach(e=>sc[e.dataset.list]=e.scrollTop);
  $('nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', S.view===b.dataset.go));
  $('root').innerHTML = S.app!==null ? page(D[S.app]) :
    toolbar() + `<div class="body ${S.side?'side-on':''}">${S.side?side():''}<section class="panel" id="res" aria-live="polite">${results()}</section></div>`;
  document.querySelectorAll('[data-list]').forEach(e=>{ if(sc[e.dataset.list]) e.scrollTop = sc[e.dataset.list]; });
  const p = document.querySelector('.pop'); if(p && p.getBoundingClientRect().right > innerWidth - 8) p.classList.add('right');
  const f = focus && document.querySelector(focus); if(f) f.focus();
}
function go(hash){ try { history.replaceState(null,'',hash); } catch(e){ location.hash = hash; } }
function route(){ const h = location.hash.slice(1), m = /^app-(\d+)$/.exec(h);
  const wasApp = S.app!==null;
  if(m && D[+m[1]]) S.app = +m[1]; else { S.app = null; S.pushed = false; if(h==='heatmap') S.view='heat'; else if(h==='list') S.view='list'; }
  render(); if(wasApp && S.app===null && S.y) scrollTo(0,S.y); }

/* ---------- events ---------- */
const tog = (k,x) => S.sel[k].has(x) ? S.sel[k].delete(x) : S.sel[k].add(x);
const root = $('root');
root.addEventListener('click',e=>{
  const t = e.target.closest('[data-open],[data-clear],[data-tv],[data-rm],[data-quick],[data-side],[data-more],[data-grp],[data-app],[data-back],[data-dom]'); if(!t) return; const d = t.dataset;
  if(d.open!==undefined){ S.pop = S.pop===d.open ? null : d.open; S.pq=''; render(S.pop && FK[S.pop].big ? '#pq' : null); return; }
  if(d.app!==undefined){ S.app = +d.app; S.pop=null; S.pushed = true; S.y = scrollY; try { history.pushState(null,'','#app-'+d.app); } catch(e){} render(); scrollTo(0,0); return; }
  if(d.back!==undefined){ if(S.pushed){ S.pushed = false; history.back(); return; } S.app = null; go(S.view==='heat'?'#heatmap':'#list'); render(); return; }
  if(d.dom!==undefined){ S.app = null; F.forEach(f=>S.sel[f.k].clear()); S.q=''; S.sel.dom.add(d.dom); S.open=null; go(S.view==='heat'?'#heatmap':'#list'); render(); return; }
  if(d.clear!==undefined){ if(d.clear==='*'){ F.forEach(f=>S.sel[f.k].clear()); S.q=''; } else S.sel[d.clear].clear(); S.pop=null; }
  else if(d.tv!==undefined) tog('tier',d.tv);
  else if(d.quick!==undefined){ const p = QUICK[+d.quick][1]; F.forEach(f=>S.sel[f.k]=new Set(p[f.k]||[])); S.q=''; S.pop=null; }
  else if(d.side!==undefined){ S.side = !S.side; S.pop=null; try { localStorage.setItem('cccp-side', S.side?'1':'0'); } catch(e){} }
  else if(d.more!==undefined){ S.lim += 50; }
  else if(d.grp!==undefined){ S.open.has(d.grp) ? S.open.delete(d.grp) : S.open.add(d.grp); }
  else if(d.rm!==undefined){ const [k,...r] = d.rm.split('|'); S.sel[k].delete(r.join('|')); }
  if(d.more===undefined && d.grp===undefined) S.lim = 50;
  render();
});
root.addEventListener('change',e=>{ const t = e.target; if(!t.matches('input[data-f]')) return; tog(t.dataset.f,t.value); S.lim = 50;
  render(`input[data-f="${t.dataset.f}"][value="${CSS.escape(t.value)}"]`); });
root.addEventListener('input',e=>{ const t = e.target;
  if(t.id==='q'){ S.q = t.value; S.lim = 50; $('res').innerHTML = results();
    if(S.side) document.querySelectorAll('.side [data-list]').forEach(l=>l.innerHTML = values(l.dataset.list,S.sq[l.dataset.list])); }
  else if(t.id==='pq'){ S.pq = t.value; t.parentElement.querySelector('.plist').innerHTML = values(t.dataset.pk,S.pq); }
  else if(t.dataset.sq){ S.sq[t.dataset.sq] = t.value; t.parentElement.querySelector('.plist').innerHTML = values(t.dataset.sq,t.value); } });
document.addEventListener('click',e=>{ if(S.pop && !e.target.closest('.pw')){ S.pop=null; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && S.pop){ const k = S.pop; S.pop=null; render(`[data-open="${k}"]`); } });
document.querySelector('.appbar').addEventListener('click',e=>{ const b = e.target.closest('[data-go]'); if(!b) return;
  S.view = b.dataset.go; S.app = null; S.pop = null; go(S.view==='heat'?'#heatmap':'#list'); render(); });
$('theme').addEventListener('click',()=>{ const r=document.documentElement, dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; });
addEventListener('popstate', route);
</script>

<script>
const O = {shell:'light', page:'sections', dq:'on', set:'tabs'};
S.ptab = 0; S.recent = []; S.closed = new Set(); S.fq = '';
const ONOTE = {
 shell:{bar:'<b>Navy bar.</b> Full-width dark bar with the views and a global application search, so you can jump to any application from any screen.',
        rail:'<b>Icon rail.</b> Views in a narrow dark column on the left; content gets the full width. No global search (the list search stays).',
        light:'<b>Light.</b> The current bar, no global search.'},
 page:{sections:'<b>Sections.</b> One long page of collapsible sections with a section jump menu and a field finder, like a LeanIX fact sheet.',
       tabs:'<b>Tabs.</b> An Overview tab with the four verdicts, identity and lifecycle, then one tab per pillar and a People tab.',
       rail:'<b>Identity rail.</b> The current page.'},
 dq:{on:'<b>Data quality on.</b> Completeness %, a review badge and a right sidebar listing missing fields and recently viewed applications; the list gets a completeness column.',
     off:'<b>Data quality off.</b> No completeness or review signals.'}
};
const KEYS = ['overview','cyber','compliance','continuity','platform','people'], TITLES = ['Overview',...P,'People'];
const CHEV = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4.5 2.5 3.5 3.5-3.5 3.5"/></svg>';
const LCS = ['Early access','Beta','General availability','End of growth','Decommissioning','End of life'];
const lcIdx = k => ({ALPHA:0,EARLY_ACCESS:0,BETA:1,GENERAL_AVAILABILITY:2,PRODUCTION:2,END_OF_GROWTH:3,END_OF_SUPPORT:4,DECOMMISSIONING:4,END_OF_LIFE:5})[k] ?? 2;
const stepper = a => { const c = lcIdx(a.lc); return '<ol class="steps" aria-label="Lifecycle">' + LCS.map((l,i)=>`<li class="${i<c?'done':i===c?'cur'+(i>=4?' end':''):''}"${i===c?' aria-current="step"':''}><span title="${l}">${l}</span></li>`).join('') + '</ol>'; };

/* completeness */
const QF = [
 ['Cyber',[['Front exposed on internet',a=>!!a.ex],['Last pentest',a=>!!a.pt[0]],['Security officer',a=>!!a.so]]],
 ['Compliance',[['CIAT levels',a=>!!a.ciat],['Personal data',a=>!!a.pd],['Date of security check',a=>!!a.val],['Last audit',a=>!!a.au[0]]]],
 ['Continuity',[['Max tolerable downtime',a=>a.mtd!=null],['Recovery time objective',a=>a.rto!=null],['Recovery point objective',a=>a.rpo!=null],['Last DRP test',a=>!!a.dt[0]]]],
 ['Platform',[['Tiering',a=>!!a.t],['Hosting type',a=>!!a.h],['Typology',a=>!!a.ty],['Single sign-on',a=>!!a.sso]]],
 ['People',[['Owner',a=>!!a.o],['Backup owner',a=>!!a.bo]]]];
function qual(a){ if(a.q) return a.q; let t=0,f=0; const g = QF.map(([n,fs])=>{ const y = fs.filter(x=>x[1](a)).length; t+=fs.length; f+=y; return Math.round(y/fs.length*100); });
  return a.q = {all:Math.round(f/t*100), g, f, t}; }
const qcls = p => p<50?'lo':p<80?'mid':'';
const qcol = p => p<50?'var(--bad)':p<80?'var(--warn)':'var(--ok)';
const ICHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const IWARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>';
function review(a){ if(!a.val) return ['need', IWARN+'Review needed'];
  const d = Math.round((TODAY - new Date(a.val))/864e5); return d>365 ? ['need', IWARN+'Review needed'] : ['done', ICHK+'Reviewed']; }

/* shared header */
function lxHead(a, jump){
  const back = S.view==='heat' ? 'Heatmap' : 'Applications', q = qual(a), rv = review(a);
  const chips = [a.ty&&`<span class="tag">${esc(a.ty)}</span>`, a.h&&`<span class="tag">${esc(a.h)}</span>`, a.ex==='Yes'&&'<span class="tag red">Internet exposed</span>',
    a.pd==='Yes'&&'<span class="tag amb">Personal data</span>', a.sso==='No'&&'<span class="tag amb">No SSO</span>'].filter(Boolean).join('');
  return `<div class="top"><button class="backbtn" data-back aria-label="Back to ${back.toLowerCase()}">${ICO.back}Back</button><nav class="crumbs" aria-label="Breadcrumb"><button data-back>${back}</button><span>/</span><button data-dom="${esc(a.d)}">${esc(a.d)}</button><span>/</span><span>${esc(a.n)}</span></nav></div>
  <div class="lxh"><div class="fh"><h1>${esc(a.n)}</h1>${O.dq==='on'?`<span class="pctb ${qcls(q.all)}" data-tip="${q.f} of ${q.t} security fields filled">${q.all}%</span><span class="rv ${rv[0]}" data-tip="${a.val?'Last security check '+a.val:'No security check on record'}">${rv[1]}</span>`:''}
    <div class="sum">${a.st.map((s,i)=>`<button class="stag ${s}" ${jump(i+1)} data-tip="${esc(a.why[i])}">${dot(s)}${P[i]}</button>`).join('')}</div></div>
    <div class="tags">${tier(a)}${lc(a)}${chips}</div>
    <p class="sub">${esc(a.d)}${a.sd?' › '+esc(a.sd):''} · ${esc(a.g)}</p></div>`;
}
const people = a => '<div class="ppl">' + [['Owner',a.o,'Accountable for the application and its risks'],['Backup owner',a.bo,'Stands in for the owner'],['Security officer',a.so,'Validates the classification and follows up findings']]
  .map(([r,n,d])=>`<div><span>${n?person(n):'<span class="res bad">None assigned</span>'}</span><span class="role">${r}</span><span class="mut">${d}</span></div>`).join('') + '</div>';
const overviewKv = a => kv([['Domain',esc(a.d)],['Subdomain',esc(a.sd)],['Support group',esc(a.g)],['Tier',tier(a)],['Typology',esc(a.ty)]]);

/* sections */
function pageSections(a){
  const q = qual(a);
  const sx = (k,i,inner) => { const st = i>=1&&i<=4 ? a.st[i-1] : null, p = i===0?null:q.g[i-1];
    return `<details class="fsx" id="sx-${k}" data-sx="${k}" ${S.closed.has(k)?'':'open'}><summary>${CHEV}${st?dot(st,STL[st]):''}<h2>${TITLES[i]}</h2>${O.dq==='on'&&p!=null?`<span class="pct">${p}%</span>`:''}${st?`<span class="why ${st}">${esc(a.why[i-1])}</span>`:''}</summary><div class="inner">${inner}</div></details>`; };
  return `<article class="panel fs">${lxHead(a, i=>`data-jump="${KEYS[i]}"`)}
    <div class="sbar"><select class="jump" aria-label="Jump to section">${TITLES.map((t,i)=>`<option value="${KEYS[i]}">${t}</option>`).join('')}</select>
      <label class="search">${ICO.search}<input class="fsearch" type="search" placeholder="Find a field" value="${esc(S.fq)}" aria-label="Find a field"></label></div>
    <div>${sx('overview',0, overviewKv(a) + '<p class="sublbl">Lifecycle</p>' + stepper(a))}
    ${[0,1,2,3].map(i=>sx(KEYS[i+1],i+1, body(a,i))).join('')}
    ${sx('people',5, people(a))}</div></article>`;
}
/* tabs */
function pageTabs(a){
  const t = S.ptab, tabs = TITLES.map((n,i)=>`<button role="tab" data-ptab="${i}" aria-selected="${i===t}">${i>=1&&i<=4?dot(a.st[i-1]):''}${n}${i===5?`<small>${[a.o,a.bo,a.so].filter(Boolean).length}</small>`:''}</button>`).join('');
  let pane;
  if(t===0) pane = `<div class="otiles">${P.map((p,i)=>`<button class="otile ${a.st[i]}" data-ptab="${i+1}"><b>${dot(a.st[i])}${p}</b><small>${esc(a.why[i])}</small></button>`).join('')}</div>
    <div class="ocols"><div><h3>Identity</h3>${overviewKv(a)}</div><div><h3>Lifecycle</h3>${stepper(a)}<h3 style="margin-top:14px">People</h3>${kv([['Owner',person(a.o)],['Security officer',a.so?person(a.so):'<span class="res bad">None assigned</span>']])}</div></div>`;
  else if(t===5) pane = people(a);
  else pane = `<p class="why ${a.st[t-1]}">${dot(a.st[t-1])}${esc(a.why[t-1])}</p>${body(a,t-1)}`;
  return `<article class="panel fs">${lxHead(a, i=>`data-ptab="${i}"`)}<div class="ptabs" role="tablist">${tabs}</div><div class="pane" role="tabpanel">${pane}</div></article>`;
}
/* data quality sidebar */
function dqSide(a){
  const q = qual(a), rv = review(a);
  const groups = QF.map(([n,fs],gi)=>`<div class="qg"><b>${n}<span>${q.g[gi]}%</span></b>${fs.map(([l,f])=>`<span class="qi ${f(a)?'y':''}"><i></i>${l}</span>`).join('')}</div>`).join('');
  const rec = S.recent.filter(i=>i!==a.i).slice(0,5);
  return `<aside class="panel dq" aria-label="Data quality">
    <div class="ringw"><span class="ring" style="--p:${q.all};--rc:${qcol(q.all)}"><b>${q.all}%</b></span><p><b>Completeness</b><br><small>${q.f} of ${q.t} security fields filled</small></p></div>
    <div><h3>Review</h3><span class="rv ${rv[0]}">${rv[1]}</span><br><small class="mut">${a.val?'Last security check '+a.val:'No security check on record'}</small></div>
    <div><h3>Fields</h3>${groups}</div>
    ${rec.length?`<div><h3>Recently viewed</h3><div class="rec">${rec.map(i=>`<button data-app="${i}">${dots(D[i])}<span>${esc(D[i].n)}</span></button>`).join('')}</div></div>`:''}
  </aside>`;
}
const basePage = page;
page = function(a){
  S.recent = [a.i, ...S.recent.filter(i=>i!==a.i)].slice(0,8);
  const main = O.page==='sections' ? pageSections(a) : O.page==='tabs' ? pageTabs(a) : basePage(a);
  return O.dq==='on' ? `<div class="lxwrap">${main}${dqSide(a)}</div>` : main;
};
const baseList = list;
list = function(R){
  const h = baseList(R); if(O.dq!=='on' || !R.length) return h;

    .replace(/<tr data-app="(\d+)">([\s\S]*?)<\/tr>/g,(m,i,inner)=>{ const q = qual(D[+i]);
      return `<tr data-app="${i}">${inner.replace('<td><span class="dots">',`<td><span class="qcell"><span class="qbar"><i style="width:${q.all}%;--c:${qcol(q.all)}"></i></span><small>${q.all}%</small></span></td><td><span class="dots">`)}</tr>`; });
};
/* field finder */
function findFields(){ const q = S.fq.trim().toLowerCase();
  document.querySelectorAll('.fsx').forEach(sx=>{ let hit = false;
    sx.querySelectorAll('.kv dt').forEach(dt=>{ const dd = dt.nextElementSibling, m = !q || (dt.textContent+' '+dd.textContent).toLowerCase().includes(q);
      dt.hidden = dd.hidden = !m; hit = hit || m; });
    if(q){ sx.open = true; sx.hidden = !hit && !sx.querySelector('h2').textContent.toLowerCase().includes(q); } else sx.hidden = false; }); }

render = function(focus){ baseRender(focus); if(S.app!==null && O.page==='sections' && S.fq) findFields(); };

/* events */
root.addEventListener('click',e=>{
  const t = e.target.closest('[data-ptab],[data-jump]'); if(!t) return;
  if(t.dataset.ptab!==undefined){ S.ptab = +t.dataset.ptab; render(); return; }
  const k = t.dataset.jump, el = $('sx-'+k); if(el){ el.open = true; el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'}); }
});
root.addEventListener('change',e=>{ if(e.target.matches('select.jump')) { const el = $('sx-'+e.target.value); el.open = true; el.scrollIntoView({block:'start'}); } });
root.addEventListener('input',e=>{ if(e.target.matches('.fsearch')){ S.fq = e.target.value; findFields(); } });
root.addEventListener('toggle',e=>{ const d = e.target; if(d.dataset && d.dataset.sx) d.open ? S.closed.delete(d.dataset.sx) : S.closed.add(d.dataset.sx); },true);
/* reset per-application state when another application opens */
root.addEventListener('click',e=>{ if(e.target.closest('[data-app]')){ S.ptab = 0; S.fq = ''; } },true);

/* global search */
const gq = $('gq'), gres = $('gres'); let gsel = 0;
function gfind(){ const q = gq.value.trim().toLowerCase(); if(!q){ gres.innerHTML=''; return []; }
  const m = D.filter(a=>a.n.toLowerCase().includes(q)).sort((x,y)=>(x.n.toLowerCase().startsWith(q)?0:1)-(y.n.toLowerCase().startsWith(q)?0:1)).slice(0,8);
  gres.innerHTML = '<div class="gres">' + (m.length ? m.map((a,i)=>`<button data-app="${a.i}" class="${i===gsel?'hl':''}">${dots(a)}<span>${esc(a.n)}</span><small>${esc(a.d)}</small></button>`).join('') : '<span class="hint">No application with that name</span>') + '</div>';
  return m; }
function gopen(i){ gq.value=''; gres.innerHTML=''; S.app = i; S.ptab = 0; S.fq = ''; S.pop = null; S.pushed = true; S.y = scrollY; try { history.pushState(null,'','#app-'+i); } catch(e){} render(); scrollTo(0,0); }
gq.addEventListener('input',()=>{ gsel = 0; gfind(); });
gq.addEventListener('keydown',e=>{ const m = gfind(); if(!m.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); gsel = (gsel + (e.key==='ArrowDown'?1:-1) + m.length) % m.length; gfind(); }
  else if(e.key==='Enter'){ gopen(m[gsel].i); } else if(e.key==='Escape'){ gq.value=''; gres.innerHTML=''; } });
gres.addEventListener('click',e=>{ const b = e.target.closest('[data-app]'); if(b) gopen(+b.dataset.app); });
document.addEventListener('click',e=>{ if(!e.target.closest('.gs')) gres.innerHTML=''; });

/* mockup options */
function applyOpts(){ document.documentElement.dataset.shell = O.shell;
  document.querySelectorAll('.opts .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', O[g.dataset.o]===b.dataset.v)));
  $('onote').innerHTML = ONOTE.shell[O.shell] + ' ' + ONOTE.page[O.page] + ' ' + ONOTE.dq[O.dq]; }
document.querySelector('.opts').addEventListener('click',e=>{ const b = e.target.closest('.seg button'); if(!b || b.parentElement.dataset.o==='set') return;
  const k = b.parentElement.dataset.o; O[k] = b.dataset.v;
  if(k==='page' && S.app===null){ S.app = D.findIndex(a=>a.t===1 && a.st.includes('bad') && a.ciat && a.rto!=null); S.y = 0; try { history.replaceState(null,'','#app-'+S.app); } catch(e){} }
  applyOpts(); render(); });
applyOpts();
if(!location.hash){ const i = D.findIndex(a=>a.t===1 && a.st.includes('bad') && a.ciat && a.rto!=null); try { history.replaceState(null,'','#app-'+i); } catch(e){} }
route();
</script>

<script>

/* gear button */
const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
$('theme').insertAdjacentHTML('beforebegin', `<button id="gear" class="icon-btn gear tip-below" aria-label="Settings" data-tip="Settings" style="order:4">${GEAR}</button>`);

/* ---------- settings state ---------- */
const MO = d => (TODAY - new Date(d)) / 2629800000;
const COLS = ['Name','Domain','Subdomain','Support Group','Owner Name','Backup Owner Name','Security Officer Name','Lifecycle','Typology','Tiering',
  'Application Front Is Exposed on Internet','Confidentiality level','Integrity Level','Availability Level','Traceability Level','Personal Data','Personal Sensitive Data','Company Sensitive Data',
  'Date of Security Check','Classification reviewed and validated by SO','Maximum Tolerable Downtime','Recovery Time Objectives','Recovery Point Objectives','Hosting Type','Single Sign-On - Availability',
  'How many internal users','How many external users'];
const MAP = [
 ['Identity',[['Name','Name','n'],['Domain','Domain','d'],['Subdomain','Subdomain','sd'],['Support group','Support Group','g'],['Owner','Owner Name','o'],['Backup owner','Backup Owner Name','bo'],['Lifecycle','Lifecycle','lc'],['Tier','Tiering','t']]],
 ['Cyber',[['Front exposed on internet','Application Front Is Exposed on Internet','ex'],['Last pentest','','pt0'],['Open findings','','pt1'],['Security officer','Security Officer Name','so']]],
 ['Compliance',[['Confidentiality','Confidentiality level',null],['Integrity','Integrity Level',null],['Availability','',null],['Traceability','Traceability Level',null],['Personal data','Personal Data','pd'],['Date of security check','Date of Security Check','val'],['Last audit','','au0']]],
 ['Continuity',[['Max tolerable downtime','Maximum Tolerable Downtime','mtd'],['Recovery time objective','Recovery Time Objectives','rto'],['Recovery point objective','Recovery Point Objectives','rpo'],['Last DRP test','','dt0'],['DRP test result','','dt1']]],
 ['Platform',[['Hosting type','Hosting Type','h'],['Typology','Typology','ty'],['Single sign-on','Single Sign-On - Availability','sso'],['Internal users','How many internal users','iu']]]];
const exVal = k => { if(!k) return '3'; const g = a => k==='pt0'?a.pt[0]:k==='pt1'?a.pt[1]:k==='au0'?a.au[0]:k==='dt0'?a.dt[0]:k==='dt1'?a.dt[1]:a[k];
  const a = D.find(x=>{ const v = g(x); return v!=null && v!==''; }); return a ? String(k==='lc'?lcl(a.lc):g(a)) : ''; };
const ST0 = {
 src:{url:'https://docs.google.com/spreadsheets/d/1qX…/edit', cache:10, tabs:{apps:'Apps',ciat:'CIAT',aud:'Audits',drp:'DRP',plat:'Platform'}},
 map:Object.fromEntries(MAP.flatMap(g=>g[1].map(f=>[f[0],f[1]]))),
 rules:{exposed:true, pentest:18, critical:true, noso:true, review:12, major:true, drpTiers:['T1','T2'], drpAge:24, drpFail:true, eol:true, nosso:true},
 access:{who:'org', groups:'', admins:['Person 0009','Person 0086']},
 disp:{view:'list', theme:'system', hidePrefix:'TO DELETE', hideEol:false}
};
let SAVED = JSON.parse(JSON.stringify(ST0)), ST = JSON.parse(JSON.stringify(ST0));
S.settings = false; S.stsec = 'source'; S.loading = false; S.loaded = '11 Nov 2026, 09:42';
const dirty = () => JSON.stringify(ST) !== JSON.stringify(SAVED);
const unmapped = () => Object.values(ST.map).filter(v=>!v).length;
const SECS = [['source','Data source','Sheet and tabs CCCP reads'],['fields','Field mapping','Which column feeds which field'],['rules','Status rules','When a dot turns amber or red'],['access','Access','Who can open CCCP and edit settings'],['display','Display','Defaults and hidden applications']];

/* counts that react to the rules */
const CNT = {
 exposed:()=>D.filter(a=>a.ex==='Yes'&&!a.pt[0]).length,
 pentest:()=>D.filter(a=>a.pt[0]&&MO(a.pt[0])>ST.rules.pentest).length,
 critical:()=>D.filter(a=>/critical/.test(a.pt[1])).length,
 noso:()=>D.filter(a=>!a.so).length,
 review:()=>D.filter(a=>!a.val||MO(a.val)>ST.rules.review).length,
 major:()=>D.filter(a=>/major/.test(a.au[1])).length,
 drpTiers:()=>D.filter(a=>a.t&&ST.rules.drpTiers.includes('T'+a.t)&&!a.dt[0]).length,
 drpAge:()=>D.filter(a=>a.dt[0]&&MO(a.dt[0])>ST.rules.drpAge).length,
 drpFail:()=>D.filter(a=>a.dt[1]==='Failed').length,
 eol:()=>D.filter(a=>['END_OF_LIFE','END_OF_SUPPORT'].includes(a.lc)).length,
 nosso:()=>D.filter(a=>a.sso==='No').length,
 hidePrefix:()=>{ const p = ST.disp.hidePrefix.trim().toLowerCase(); return p ? D.filter(a=>a.n.toLowerCase().startsWith(p)).length : 0; },
 hideEol:()=>D.filter(a=>['END_OF_LIFE','END_OF_SUPPORT'].includes(a.lc)).length
};
const aff = k => `<span class="aff" data-cnt="${k}"><b>${num(CNT[k]())}</b> apps</span>`;

/* controls */
const sf = (label, help, ctrl) => `<div class="sf"><div class="sfl"><b>${label}</b>${help?`<small>${help}</small>`:''}</div><div class="sfc">${ctrl}</div></div>`;
const sw = (path, on, lbl) => `<label class="sw"><input type="checkbox" data-st="${path}" ${on?'checked':''} aria-label="${esc(lbl)}"><span></span></label>`;
const numu = (path, v, unit, lbl) => `<span class="numu"><input type="number" min="1" max="120" data-st="${path}" value="${v}" aria-label="${esc(lbl)}"><span>${unit}</span></span>`;
const segs = (path, v, opts) => `<span class="segs" role="group">${opts.map(([k,l])=>`<button data-seg="${path}" data-v="${k}" aria-pressed="${v===k}">${l}</button>`).join('')}</span>`;

function secSource(){
  const n = {apps:D.length, ciat:D.filter(a=>a.ciat).length, aud:D.filter(a=>a.au[0]||a.pt[0]).length, drp:D.filter(a=>a.rto!=null).length, plat:D.length};
  const tabs = [['apps','Applications'],['ciat','CIAT classification'],['aud','Audits & pentests'],['drp','Disaster recovery'],['plat','Platform']];
  const opts = v => ['Apps','CIAT','Audits','DRP','Platform','Archive'].map(t=>`<option ${t===v?'selected':''}>${t}</option>`).join('');
  const miss = k => k==='aud' ? 'Last audit, Last pentest, Open findings not mapped' : k==='drp' ? 'Last DRP test, Test result not mapped' : '';
  return `<div class="conn"><div><b>${dot(unmapped()?'warn':'ok')}Connected to “CCCP security data”</b><small>Last loaded ${S.loaded} · ${num(D.length)} applications</small></div>
      <button class="btn" data-reload ${S.loading?'disabled':''}>${S.loading?'<span class="spin" aria-hidden="true"></span>Loading…':'Reload data'}</button></div>
    <div class="sgrp">${sf('Google Sheet','The spreadsheet CCCP reads. The app reads it with the deployer’s access, so viewers don’t need access to the sheet.', `<input class="inp wide" data-st="src.url" value="${esc(ST.src.url)}" aria-label="Google Sheet link">`)}
    ${sf('Keep data in memory for','After this, the next visitor reloads from the sheet.', numu('src.cache', ST.src.cache, 'minutes','Cache minutes'))}</div>
    <div class="sgrp"><h3>Sheet tabs</h3><div class="mt"><table><thead><tr><th>Data</th><th>Tab</th><th>Rows</th><th>Status</th></tr></thead><tbody>
    ${tabs.map(([k,l])=>`<tr><td>${l}</td><td><select class="sel" data-st="src.tabs.${k}" aria-label="${l} tab">${opts(ST.src.tabs[k])}</select></td><td class="num">${num(n[k])}</td><td>${miss(k)?`<span class="res warn" title="${miss(k)}">Columns missing</span>`:'<span class="res ok">OK</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function secFields(){
  const u = unmapped();
  return `${u?`<div class="callout">${dot('warn')}<span><b>${u} fields are not mapped.</b> They show as empty on every application and count as missing in completeness. Pick the column that holds them, or leave them unmapped until the data exists.</span></div>`:''}
  <div class="mt"><table><thead><tr><th>CCCP field</th><th>Sheet column</th><th>Example value</th></tr></thead><tbody>` +
  MAP.map(([g,fs])=>`<tr class="pgrp"><td colspan="3">${g}</td></tr>` + fs.map(([f,,k])=>{ const v = ST.map[f];
    return `<tr><td>${f}</td><td><select class="sel ${v?'':'unmapped'}" data-st="map.${f}" aria-label="Column for ${f}"><option value="" ${v?'':'selected'}>Not mapped</option>${COLS.map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}</select></td><td class="ex">${v?esc(exVal(k)):'<span class="mut">—</span>'}</td></tr>`; }).join('')).join('') + '</tbody></table></div>';
}
function rule(k, st, txt, onPath){ const on = onPath ? ST.rules[k] : true;
  return `<div class="rule ${on?'':'off'}">${dot(st)}<span class="txt">${txt}</span>${aff(k)}${onPath?sw('rules.'+k, on, 'Rule on'):'<span></span>'}</div>`; }
function secRules(){
  const r = ST.rules, tiers = `<span class="tchips">${['T1','T2','T3','T4'].map(t=>`<button data-tier="${t}" aria-pressed="${r.drpTiers.includes(t)}">${t}</button>`).join('')}</span>`;
  return `<div class="sgrp"><h3>${dot('bad')}Cyber</h3>
     ${rule('exposed','bad','Exposed on the internet and never pentested',1)}
     ${rule('pentest','warn',`Last pentest older than ${numu('rules.pentest', r.pentest,'months','Pentest age')}`)}
     ${rule('critical','bad','A critical finding is open',1)}
     ${rule('noso','bad','No security officer assigned',1)}</div>
   <div class="sgrp"><h3>${dot('bad')}Compliance</h3>
     ${rule('review','warn',`Classification missing or last checked more than ${numu('rules.review', r.review,'months','Review interval')} ago <small class="mut">· also shows “Review needed”</small>`)}
     ${rule('major','bad','A major audit finding is open',1)}</div>
   <div class="sgrp"><h3>${dot('bad')}Continuity</h3>
     ${rule('drpTiers','bad',`No DRP test on record for ${tiers}`)}
     ${rule('drpAge','warn',`Last DRP test older than ${numu('rules.drpAge', r.drpAge,'months','DRP test age')}`)}
     ${rule('drpFail','bad','Last DRP test failed',1)}</div>
   <div class="sgrp"><h3>${dot('bad')}Platform</h3>
     ${rule('eol','bad','Still running past end of life or end of support',1)}
     ${rule('nosso','warn','No single sign-on',1)}</div>

function secAccess(){
  const a = ST.access;

      <label class="rcard"><input type="radio" name="who" data-st="access.who" value="groups" ${a.who==='groups'?'checked':''}><span><b>Only these Google groups</b><small>For example security-team@ and it-leads@</small></span></label></div>

      <div class="addp"><input class="inp wide" id="newadmin" placeholder="Name or email" aria-label="Add an admin"><button class="btn" data-addadmin>Add</button></div>`)}</div>`;
}
function secDisplay(){
  const d = ST.disp;
  return `<div class="sgrp">${sf('Opens on','The view people see when they open CCCP.', segs('disp.view', d.view, [['list','List'],['heat','Heatmap']]))}
    ${sf('Theme','People can still switch with the sun icon.', segs('disp.theme', d.theme, [['system','System'],['light','Light'],['dark','Dark']]))}</div>
    <div class="sgrp"><h3>Hidden applications</h3>
    ${sf('Hide names starting with','Leftover or test entries. Leave empty to show everything.', `<input class="inp" data-st="disp.hidePrefix" value="${esc(d.hidePrefix)}" aria-label="Hide names starting with">${aff('hidePrefix')}`)}
